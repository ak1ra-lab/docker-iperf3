name: Build and Push iperf3 Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - actions

jobs:
  build-n-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      # https://github.com/actions/checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # https://github.com/docker/login-action
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://dl-cdn.alpinelinux.org/
      # alpine version: edge, latest-stable, v3.22, ...
      # alpine architectures: aarch64, armhf, armv7, loongarch64, ppc64le, riscv64, s390x, x86, x86_64
      # https://gitlab.alpinelinux.org/alpine/infra/infra/-/issues/10791#note_300890
      # x86_64 is hardcoded here, but the iperf3 version for
      # different CPU architectures is not guaranteed to be completely consistent.
      # How should tags be handled in this case when build multi-arch image?
      - name: Get Alpine iperf3 version
        id: iperf3-version
        run: |
          set -o pipefail -o errexit -o nounset
          IPERF3_VERSION=$(
            curl -s https://dl-cdn.alpinelinux.org/latest-stable/main/x86_64/APKINDEX.tar.gz |
              tar -O -xz -f - | sed -n '/^P:iperf3$/,/^$/p' | awk -F '[:-]' '/^V:/ {print $2}'
          )
          echo "IPERF3_VERSION=${IPERF3_VERSION}" >>$GITHUB_ENV

      # https://github.com/docker/metadata-action
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/iperf3
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.IPERF3_VERSION }}

      # https://github.com/docker/build-push-action
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # https://docs.docker.com/build/metadata/attestations/
          # The default image store doesn't support attestations. If you're using the default image store and you build an image using the default docker driver, or using a different driver with the --load flag, the attestations are lost.
          sbom: true
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
